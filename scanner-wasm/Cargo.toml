[package]
name = "scanner-wasm"
version = "0.1.0"
edition = "2021"
description = "Scan kamera 1D barcode lintas web + wasm"
license = "MIT"

[features]
default = []
# Hanya untuk smoke-test lokal (encode -> decode). Tidak dipakai build produksi.
dev-encoder = ["rxing/encoders"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
rxing = { version = "0.9", default-features = false, features = ["decoders", "oned", "encoding_rs"] }
console_error_panic_hook = "0.1"

[patch.crates-io]
# rxing lokal (vendor) sudah dipatch: buang chrono::Utc::now() yang panic di
# wasm32-unknown-unknown ("time not implemented on this platform").
rxing = { path = "vendor/rxing" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false